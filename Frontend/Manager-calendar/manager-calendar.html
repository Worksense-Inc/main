<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorkSense — Manager Board</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-wave" aria-hidden="true"></div>

    <nav id="pages" aria-label="Primary">
      <a href="../Manager-board/manager.html">Shift Requests</a>
      <a href="../Login/login.html">Sign Out</a>
    </nav>

    <main>
      <header style="margin: 0.25rem 0 1rem">
        <h1 style="font-size: 1.25rem; margin: 0 0 0.25rem">Manager Board</h1>
        <p class="muted" id="welcome"></p>
      </header>

      <section class="workspace" aria-label="Schedule overview">
        <article class="card" aria-labelledby="cal-h">
          <h2 id="cal-h">Shift Calendar</h2>
          <div class="calendar-container">
            <div id="mini-cal-root" class="mini-cal" aria-live="polite"></div>
          </div>
        </article>

        <article class="card" id="shifts" aria-labelledby="list-h">
          <h2 id="list-h">Shifts</h2>
          <div class="shift-list">
            <div class="shift-list__filters">
              <label
                >Selected day: <input id="selected-day" type="date"
              /></label>
              <label
                >Employee:
                <select id="employee-filter"></select
              ></label>
            </div>
            <ul
              id="shifts-container"
              class="shift-list"
              aria-live="polite"
            ></ul>
          </div>
        </article>
      </section>
    </main>

    <script>
      (function () {
        const ALL = '__all__';

        const pad = (n) => String(n).padStart(2, '0');
        const toLocalISO = (d) =>
          `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

        if (!window.currentUser) window.currentUser = 'Alex';
        const demo = [
          {
            date: '2025-11-10',
            start: '09:00',
            end: '13:00',
            employee: 'Alex',
            note: 'Front desk',
          },
          {
            date: '2025-11-10',
            start: '12:00',
            end: '18:00',
            employee: 'Sam',
            note: 'Kitchen',
          },
          {
            date: '2025-11-11',
            start: '10:00',
            end: '16:00',
            employee: 'Alex',
            note: 'Register',
          },
          {
            date: '2025-11-12',
            start: '08:00',
            end: '12:00',
            employee: 'Jamie',
            note: 'Inventory',
          },
        ];
        const allShifts = Array.isArray(window.shiftsData)
          ? window.shiftsData.slice()
          : demo;

        const normalize = (s) => (s ?? '').toString().trim().toLowerCase();
        const matchesEmployee = (shiftEmp, who) =>
          who === ALL || normalize(shiftEmp) === normalize(who);

        function createMiniCalendar(
          rootId,
          { events = new Set(), onDayClick } = {}
        ) {
          const root = document.getElementById(rootId);
          const state = { view: new Date(), events: new Set(events) };
          const todayISO = toLocalISO(new Date());

          const el = document.createElement('div');
          el.className = 'mini-cal';
          el.innerHTML = `
            <div class="mini-cal__bar">
              <div class="mini-cal__title" aria-live="polite"></div>
              <div class="mini-cal__nav">
                <button class="mini-cal__btn" data-dir="-1" aria-label="Previous month">‹</button>
                <button class="mini-cal__btn" data-dir="1" aria-label="Next month">›</button>
              </div>
            </div>
            <div class="mini-cal__week" aria-hidden="true">
              <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
              <div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div class="mini-cal__grid" role="grid" aria-readonly="true"></div>
          `;
          root.replaceWith(el);

          const title = el.querySelector('.mini-cal__title');
          const grid = el.querySelector('.mini-cal__grid');

          el.addEventListener('click', (e) => {
            const nav = e.target.closest('[data-dir]');
            if (nav) {
              const dir = Number(nav.dataset.dir);
              const d = state.view;
              state.view = new Date(d.getFullYear(), d.getMonth() + dir, 1);
              render();
              return;
            }
            const day = e.target.closest('.mini-cal__cell[data-date]');
            if (day && typeof onDayClick === 'function')
              onDayClick(day.dataset.date);
          });

          function render() {
            const d = state.view;
            const y = d.getFullYear();
            const m = d.getMonth();
            const first = new Date(y, m, 1);
            const startDay = first.getDay();
            const daysInMonth = new Date(y, m + 1, 0).getDate();

            title.textContent = d.toLocaleString(undefined, {
              month: 'long',
              year: 'numeric',
            });

            const cells = [];
            for (let i = 0; i < 42; i++) {
              const cell = document.createElement('div');
              cell.className = 'mini-cal__cell';

              let dateObj;
              if (i < startDay) {
                dateObj = new Date(y, m, 1 - (startDay - i));
              } else if (i >= startDay + daysInMonth) {
                dateObj = new Date(
                  y,
                  m,
                  i - (startDay + daysInMonth) + 1 + daysInMonth
                );
              } else {
                dateObj = new Date(y, m, i - startDay + 1);
              }

              const dateISO = toLocalISO(dateObj);
              const out = dateObj.getMonth() !== m;

              if (out) cell.classList.add('mini-cal__cell--out');
              if (dateISO === todayISO)
                cell.classList.add('mini-cal__cell--today');
              if (state.events.has(dateISO)) {
                const dot = document.createElement('span');
                dot.className = 'mini-cal__dot';
                cell.appendChild(dot);
                cell.classList.add('mini-cal__cell--has-shift');
              }

              cell.textContent = String(dateObj.getDate());
              cell.setAttribute('data-date', dateISO);
              cells.push(cell);
            }
            grid.replaceChildren(...cells);
          }

          render();
          return {
            setEvents(dates) {
              state.events = new Set(dates);
              render();
            },
            goTo(year, monthIndex0) {
              state.view = new Date(year, monthIndex0, 1);
              render();
            },
          };
        }

        document.addEventListener('DOMContentLoaded', () => {
          const welcome = document.getElementById('welcome');
          welcome.textContent = `Welcome, ${window.currentUser}!`;

          const selectedDay = document.getElementById('selected-day');
          const employeeFilter = document.getElementById('employee-filter');
          const container = document.getElementById('shifts-container');

          const uniqueEmployees = Array.from(
            new Set(allShifts.map((s) => s.employee))
          ).sort();
          employeeFilter.innerHTML =
            `<option value="${ALL}">All employees</option>` +
            uniqueEmployees
              .map((e) => `<option value="${e}">${e}</option>`)
              .join('');
          employeeFilter.value = ALL;

          const getFilteredEventDates = () => {
            const who = employeeFilter.value;
            return new Set(
              allShifts
                .filter((s) => matchesEmployee(s.employee, who))
                .map((s) => s.date)
            );
          };

          const cal = createMiniCalendar('mini-cal-root', {
            events: getFilteredEventDates(),
            onDayClick: (iso) => {
              selectedDay.value = iso;
              renderShifts();
            },
          });

          const todayISO = toLocalISO(new Date());
          const initialDates = getFilteredEventDates();
          selectedDay.value = initialDates.has(todayISO)
            ? todayISO
            : allShifts.find((s) => initialDates.has(s.date))?.date || todayISO;

          selectedDay.addEventListener('change', renderShifts);
          employeeFilter.addEventListener('change', () => {
            const dates = getFilteredEventDates();
            cal.setEvents(dates);

            if (!dates.has(selectedDay.value)) {
              selectedDay.value = dates.has(todayISO)
                ? todayISO
                : allShifts.find((s) => dates.has(s.date))?.date || todayISO;
            }
            renderShifts();
          });

          function renderShifts() {
            const iso = selectedDay.value;
            const who = employeeFilter.value;

            const list = allShifts.filter(
              (s) => s.date === iso && matchesEmployee(s.employee, who)
            );

            container.replaceChildren();

            if (!list.length) {
              const empty = document.createElement('li');
              empty.className = 'shift-empty';
              empty.textContent = 'No shifts match these filters.';
              container.appendChild(empty);
              return;
            }

            for (const s of list) {
              const li = document.createElement('li');
              li.className = 'shift-item';
              li.setAttribute('role', 'listitem');
              li.innerHTML = `
                <div>
                  <span class="time">${s.start}–${s.end}</span>
                  <span class="who">· ${s.employee}</span>
                  ${s.note ? `<span class="note"> — ${s.note}</span>` : ''}
                </div>
                <div class="date">${s.date}</div>
              `;
              container.appendChild(li);
            }
          }

          renderShifts();
        });
      })();
    </script>
  </body>
</html>
