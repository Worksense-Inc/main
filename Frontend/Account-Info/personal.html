<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>WorkSense — Account Details</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-wave" aria-hidden="true"></div>

    <header class="site-header">
      <div class="brand">
        <span class="dot"></span>
        <span class="logo-text">WorkSense</span>
      </div>
      <nav id="pages" aria-label="Primary">
        <a href="../Home/home.html">Home</a>
        <a href="../Forms/forms.html">Forms</a>
        <a href="../Login/login.html">Sign Out</a>
      </nav>
    </header>

    <main class="shell" id="content">
      <div class="head">
        <h1>Account Details</h1>
        <p class="hint">Basic info used across scheduling and notifications.</p>
      </div>

      <section class="grid">
        <aside class="card profile">
          <div class="avatar" aria-hidden="true">JD</div>
          <div class="profile-meta">
            <h2 class="tight">Jorge Gonzales</h2>
            <p class="muted">Manager • Central Team</p>
          </div>
          <button class="btn ghost" type="button">Change Photo</button>
        </aside>

        <form class="card form" action="#" method="post" novalidate>
          <div class="row">
            <label for="first">First name</label>
            <input id="first" name="first" placeholder="Jamie" />
          </div>

          <div class="row">
            <label for="last">Last name</label>
            <input id="last" name="last" placeholder="Douglass" />
          </div>

          <div class="row">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="jamie@worksense.com"
            />
          </div>

          <div class="row">
            <label for="phone">Phone</label>
            <input
              id="phone"
              name="phone"
              inputmode="tel"
              placeholder="(555) 123-4567"
            />
          </div>

          <div class="row">
            <label for="location">Location / Timezone</label>
            <div class="field-split">
              <input id="location" name="location" placeholder="Chicago, IL" />
              <select id="tz" name="tz" aria-label="Timezone">
                <option>America/Chicago (CST)</option>
                <option>America/New_York (EST)</option>
                <option>America/Los_Angeles (PST)</option>
              </select>
            </div>
          </div>

          <div class="row">
            <label for="role">Role</label>
            <input id="role" name="role" placeholder="Manager" />
          </div>

          <div class="actions">
            <button class="btn primary" type="submit">Save Changes</button>
            <button class="btn ghost" type="button">Cancel</button>
          </div>
        </form>
      </section>

      <section class="card slim">
        <h3 class="tight">Notification Preferences</h3>
        <p class="muted small">A rough stub—wire up later.</p>
        <div class="switch-row">
          <label class="switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
          <span>Email me when shifts change</span>
        </div>
        <div class="switch-row">
          <label class="switch">
            <input type="checkbox" />
            <span class="slider"></span>
          </label>
          <span>Text me daily reminders</span>
        </div>
      </section>
    </main>

    <footer class="foot">
      <small class="muted">© 2025 WorkSense</small>
    </footer>
  </body>
</html>
