<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorkSense — Shifts</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-wave" aria-hidden="true"></div>

  <nav id="pages">
    <a href="#">Forms</a>
    <a href="#">Account Details</a>
    <a href="#">Sign Out</a>
  </nav>

  <section class="workspace">
    <aside class="card" id="shifts">
      <h2>
        Shifts
        <small id="who" class="who"></small>
      </h2>

      <div id="activeFilter" class="active-filter" hidden>
        Showing shifts for <strong id="filterDateText"></strong>
        <button id="clearFilter" class="link-btn">Clear</button>
      </div>

      <ul id="shift-list" class="shift-list"></ul>
    </aside>

    <div class="calendar-container">
      <div id="cal-root"></div>
    </div>
  </section>

  <script>

    if (!window.currentUser) window.currentUser = "Alex"; 


    const demo = [
      { date: "2025-11-10", start: "09:00", end: "13:00", employee: "Alex",  note: "Front desk" },
      { date: "2025-11-10", start: "12:00", end: "18:00", employee: "Sam",   note: "Kitchen" },
      { date: "2025-11-11", start: "10:00", end: "16:00", employee: "Alex",  note: "Register" },
      { date: "2025-11-12", start: "08:00", end: "12:00", employee: "Jamie", note: "Inventory" }
    ];
    const allShifts = Array.isArray(window.shiftsData) ? window.shiftsData.slice() : demo;

    function getUserShifts(name) {
      return allShifts
        .filter(s => (s.employee || "").toLowerCase() === (name || "").toLowerCase());
    }

    function createMiniCalendar(rootId, { events = new Set(), onDayClick } = {}) {
      const root = document.getElementById(rootId);
      const state = { view: new Date(), events: new Set(events) };
      const todayISO = new Date().toISOString().slice(0, 10);

      const el = document.createElement("div");
      el.className = "mini-cal";
      el.innerHTML = `
        <div class="mini-cal__bar">
          <div class="mini-cal__title" aria-live="polite"></div>
          <div class="mini-cal__nav">
            <button class="mini-cal__btn" data-dir="-1" aria-label="Previous month">‹</button>
            <button class="mini-cal__btn" data-dir="1" aria-label="Next month">›</button>
          </div>
        </div>
        <div class="mini-cal__week" aria-hidden="true">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
          <div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="mini-cal__grid" role="grid" aria-readonly="true"></div>
      `;
      root.appendChild(el);

      const title = el.querySelector(".mini-cal__title");
      const grid  = el.querySelector(".mini-cal__grid");

      el.addEventListener("click", (e) => {
        const nav = e.target.closest("[data-dir]");
        if (nav) {
          const dir = Number(nav.dataset.dir);
          const d = state.view;
          state.view = new Date(d.getFullYear(), d.getMonth() + dir, 1);
          render();
          return;
        }
        const day = e.target.closest(".mini-cal__cell[data-date]");
        if (day && typeof onDayClick === "function") onDayClick(day.dataset.date);
      });

      function render() {
        const d = state.view;
        const y = d.getFullYear(), m = d.getMonth();
        const first = new Date(y, m, 1);
        const startDay = first.getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const prevDays = new Date(y, m, 0).getDate();

        title.textContent = d.toLocaleString(undefined, { month: "long", year: "numeric" });

        const cells = [];
        for (let i = 0; i < 42; i++) {
          const cell = document.createElement("div");
          cell.className = "mini-cal__cell";
          let dayNum, dateISO, out = false;

          if (i < startDay) {
            dayNum = prevDays - startDay + i + 1;
            dateISO = new Date(y, m - 1, dayNum).toISOString().slice(0, 10);
            out = true;
          } else if (i >= startDay + daysInMonth) {
            dayNum = i - (startDay + daysInMonth) + 1;
            dateISO = new Date(y, m + 1, dayNum).toISOString().slice(0, 10);
            out = true;
          } else {
            dayNum = i - startDay + 1;
            dateISO = new Date(y, m, dayNum).toISOString().slice(0, 10);
          }

          // visuals
          if (out) cell.classList.add("mini-cal__cell--out");
          if (dateISO === todayISO) cell.classList.add("mini-cal__cell--today");
          if (state.events.has(dateISO)) {
            // Add dot + strong background highlight so it's obvious
            const dot = document.createElement("span");
            dot.className = "mini-cal__dot";
            cell.appendChild(dot);
            cell.classList.add("mini-cal__cell--has-shift");
          }

          cell.textContent = dayNum;
          cell.setAttribute("data-date", dateISO);
          cells.push(cell);
        }
        grid.replaceChildren(...cells);
      }

      render();
      return {
        setEvents(dates) { state.events = new Set(dates); render(); },
        goTo(year, monthIndex0) { state.view = new Date(year, monthIndex0, 1); render(); }
      };
    }

    const whoEl = document.getElementById("who");
    const listEl = document.getElementById("shift-list");
    const filterBar = document.getElementById("activeFilter");
    const filterDateText = document.getElementById("filterDateText");
    const clearFilterBtn = document.getElementById("clearFilter");

    let activeDateFilter = null; // ISO date or null
    let userShifts = getUserShifts(window.currentUser);

    if (whoEl) whoEl.textContent = `· ${window.currentUser}`;

    function renderShifts() {
      const data = activeDateFilter
        ? userShifts.filter(s => s.date === activeDateFilter)
        : userShifts.slice();
      data.sort((a,b) => (a.date + a.start).localeCompare(b.date + b.start));

      const byDate = {};
      for (const s of data) (byDate[s.date] ||= []).push(s);

      listEl.innerHTML = "";
      const dates = Object.keys(byDate).sort();

      if (dates.length === 0) {
        listEl.innerHTML = `<li class="shift-empty">No shifts to display.</li>`;
      } else {
        for (const d of dates) {
          const header = document.createElement("li");
          header.className = "shift-date-header";
          header.textContent = new Date(d).toLocaleDateString(undefined, {
            weekday:"short", month:"short", day:"numeric"
          });
          listEl.appendChild(header);

          for (const s of byDate[d]) {
            const li = document.createElement("li");
            li.className = "shift-item";
            li.innerHTML = `
              <span class="time">${s.start}–${s.end}</span>
              <span class="note">${s.note ? s.note : ""}</span>
            `;
            listEl.appendChild(li);
          }
        }
      }

      const eventDates = [...new Set(userShifts.map(s => s.date))];
      calendar.setEvents(eventDates);

      if (activeDateFilter) {
        filterDateText.textContent = new Date(activeDateFilter).toLocaleDateString(undefined, {
          weekday:"long", month:"long", day:"numeric"
        });
        filterBar.hidden = false;
      } else {
        filterBar.hidden = true;
      }
    }

    const calendar = createMiniCalendar("cal-root", {
      onDayClick: (iso) => {
        activeDateFilter = iso;
        renderShifts();
        document.getElementById("shifts")?.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });

    clearFilterBtn?.addEventListener("click", () => {
      activeDateFilter = null;
      renderShifts();
    });

    renderShifts();

    // window.loadShiftsForUser = function(name, newAllShifts) {
    //   if (Array.isArray(newAllShifts)) {
    //     // replace the all-shifts store
    //     while (allShifts.length) allShifts.pop();
    //     allShifts.push(...newAllShifts);
    //   }
    //   window.currentUser = name || window.currentUser;
    //   userShifts = getUserShifts(window.currentUser);
    //   activeDateFilter = null;
    //   if (whoEl) whoEl.textContent = `· ${window.currentUser}`;
    //   renderShifts();
    // }
  </script>
</body>
</html>
